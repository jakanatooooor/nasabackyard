<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NASA in Your Backyard Simulator</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#070b14;color:#e8edf7;font-family:Inter,system-ui,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}
body{min-height:100vh}.hidden{display:none!important}.screen{min-height:100vh;padding:22px}
#start{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 70% 20%,#23385f 0,#0a1020 38%,#05070c 100%);overflow:hidden;position:relative}
.stars{position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:73px 61px;opacity:.25}
.title{text-align:center;position:relative;max-width:850px}.title h1{font-size:clamp(42px,8vw,92px);line-height:.9;margin:0 0 16px;letter-spacing:-4px}.title p{color:#9eacc4;font-size:18px}
.logoRocket{font-size:82px;filter:drop-shadow(0 10px 22px #000)}
.menu{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:28px}.btn{border:1px solid #33415d;background:#121a2b;color:#eef3ff;padding:13px 18px;border-radius:11px;transition:.15s}.btn:hover{background:#1a2740;transform:translateY(-1px)}.primary{background:#d8e5ff;color:#07101e;border-color:#fff;font-weight:800}.danger{background:#32161a;border-color:#74323b}.tiny{font-size:12px;padding:7px 10px}.note{font-size:12px;color:#74839b;margin-top:15px}
#game{background:#0a0f19}.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-bottom:1px solid #1c2638;padding-bottom:12px}.brand{font-weight:900;letter-spacing:.8px}.stats{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#111a2a;border:1px solid #25334a;padding:7px 10px;border-radius:999px;font-size:13px}
.tabs{display:flex;gap:7px;overflow:auto;padding:12px 0}.tab{white-space:nowrap}.tab.active{background:#e3ecff;color:#07101e}
.view{max-width:1250px;margin:auto}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}.card{background:#0e1624;border:1px solid #243148;border-radius:15px;padding:15px}.card h2,.card h3{margin:0 0 10px}.muted{color:#8795aa}.small{font-size:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.list{display:grid;gap:8px}.item{background:#111b2c;border:1px solid #24344d;border-radius:10px;padding:11px}.item.locked{opacity:.55}.item b{display:block;margin-bottom:3px}.item p{margin:3px 0;color:#9aa8bc;font-size:13px}.price{color:#b9cae8}.ok{color:#79e0a0}.bad{color:#ff8995}
.house{position:relative;min-height:440px;background:#131b27;border:1px solid #31405a;border-radius:15px;overflow:hidden}.houseTop{height:50%;border-bottom:2px solid #3d4a5d;background:#202b3a;padding:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.houseBottom{height:50%;padding:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#1a241e}.room{border:1px solid #4a5970;border-radius:10px;padding:10px;background:#263346;min-height:90px}.room.ground{background:#263622}.room b{font-size:13px}.room span{display:block;color:#93a2b7;font-size:11px;margin-top:5px}.yard{height:360px;position:relative;border:1px solid #33435b;border-radius:15px;overflow:hidden;background:linear-gradient(#071121 0 43%,#263b1d 43%);margin-bottom:12px}.yard:before{content:"";position:absolute;inset:0 0 57%;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:53px 47px;opacity:.28}.ground{position:absolute;bottom:0;left:0;right:0;height:57%;background:repeating-linear-gradient(0deg,#263b1d 0 17px,#304b23 18px 19px)}.pad{position:absolute;bottom:70px;left:50%;width:180px;height:26px;transform:translateX(-50%);background:#666;border-radius:50%}.rocket{position:absolute;bottom:92px;left:50%;transform:translateX(-50%);font-size:58px;transition:bottom 2s,transform 2s}.rocket.launch{bottom:330px;transform:translateX(-50%) rotate(3deg) scale(.65)}.building{position:absolute;background:#7b8491;border:3px solid #313946;border-radius:5px}.garage{left:18px;bottom:55px;width:135px;height:90px}.radar{right:25px;bottom:75px;width:80px;height:80px;border-radius:50%;background:#424b57}.fire{position:absolute;bottom:45px;left:50%;transform:translateX(-50%);font-size:50px;animation:flick .15s infinite alternate}.explode{animation:boom .45s ease-out}.smoke{position:absolute;bottom:100px;left:50%;font-size:50px;animation:smoke 2s ease-out forwards}@keyframes boom{50%{transform:translateX(-50%) scale(2) rotate(15deg);filter:brightness(2)}100%{opacity:0;transform:translateX(-50%) scale(.2)}}@keyframes smoke{to{bottom:260px;opacity:0;transform:translateX(-50%) scale(2)}}@keyframes flick{to{transform:translateX(-50%) scale(1.15)}}
.parts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.part{padding:9px;border:1px solid #2a3951;border-radius:9px;background:#101a29}.part input{width:100%;margin-top:7px}.bar{height:8px;background:#202b3b;border-radius:9px;overflow:hidden}.bar span{display:block;height:100%;background:#a8c4ff}.blueprint{background:#071522;border:1px solid #29415c;border-radius:12px;padding:12px;min-height:300px}.stage{border:1px dashed #4c6480;margin:8px auto;padding:10px;text-align:center;width:min(75%,300px);background:#0c2130}.engineDot{display:inline-block;background:#d9e6ff;color:#07101e;border-radius:50%;padding:6px;margin:3px}
.research{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.tech{border:1px solid #293a54;border-radius:10px;padding:11px;background:#101a29}.tech.unlocked{border-color:#58749e}.tech.done{background:#13291f;border-color:#3c7858}.tech button{margin-top:8px}.mission{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.world{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.planet{min-height:140px;border:1px solid #2a3951;border-radius:14px;padding:14px;background:radial-gradient(circle at 70% 25%,#263956,#101826 60%)}.planet.done{border-color:#55b879;background:#11271c}.planet .orb{font-size:42px}.toast{position:fixed;right:16px;bottom:16px;background:#121c2c;border:1px solid #425775;padding:13px 15px;border-radius:10px;z-index:9;max-width:330px;box-shadow:0 10px 35px #0008}
@media(max-width:800px){.grid{grid-template-columns:1fr}.research,.world{grid-template-columns:1fr 1fr}.houseBottom,.houseTop{grid-template-columns:1fr 1fr}.title h1{letter-spacing:-2px}}
@media(max-width:520px){.screen{padding:12px}.research,.world{grid-template-columns:1fr}.yard{height:310px}.rocket{font-size:48px}.house{min-height:500px}.houseTop,.houseBottom{grid-template-columns:1fr}.parts{grid-template-columns:1fr}}
</style>
</head>
<body>
<section id="start" class="screen">
<div class="stars"></div><div class="title"><div class="logoRocket">🚀</div><h1>NASA IN YOUR<br>BACKYARD</h1><p>Engineer rockets. Build a space program. Break things. Reach orbit. Then conquer the Solar System.</p>
<div class="menu"><button class="btn primary" onclick="newGame('story')">STORY MODE</button><button class="btn" onclick="newGame('creative')">CREATIVE MODE</button><button class="btn" onclick="showHow()">HOW TO PLAY</button></div><div class="note">Story runs are designed to take about 30 minutes. Creative is unlimited.</div></div>
</section>

<section id="game" class="screen hidden"><div class="view">
<div class="top"><div class="brand">🚀 NASA IN YOUR BACKYARD <span id="modeLabel" class="muted"></span></div><div class="stats"><span class="pill">💵 $<b id="money">500</b></span><span class="pill">🔬 <b id="science">0</b> SP</span><span class="pill">⭐ <b id="rep">0</b> REP</span><span class="pill">🏆 <b id="orbit">0</b> ORBITS</span></div></div>
<div class="tabs">
<button class="btn tab active" data-tab="backyard">Backyard</button><button class="btn tab" data-tab="house">House</button><button class="btn tab" data-tab="rocket">Rocket Lab</button><button class="btn tab" data-tab="research">Research</button><button class="btn tab" data-tab="missions">Missions</button><button class="btn tab" data-tab="solar">Solar System</button>
<button class="btn tiny danger" onclick="resetGame()">New Game</button>
</div>
<div id="content"></div></div></section>
<div id="toast" class="toast hidden"></div>

<script>
const C={};
let state=null, tab='backyard';
const defaultState=()=>({mode:'story',money:500,science:0,rep:0,orbit:0,parts:{workshop:false,teststand:false,computer:false,fuelgear:false,pad:false,tracking:false,advancedLab:false},tech:{basic:false,liquid:false,staging:false,guidance:false,orbital:false,reusable:false,deep:false,nuclear:false,lunar:false,interplanetary:false},rocket:{fuel:40,engines:1,tanks:1,stages:1,computer:0,fins:2,payload:0,shield:0},missions:{launch:false,height:false,science:false,orbit:false,moon:false,mars:false,jupiter:false,saturn:false,uranus:false,neptune:false},house:{floor:1,secret:false},time:0,cheese:false,won:false});
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(x){$('toast').textContent=x;$('toast').classList.remove('hidden');clearTimeout(C.t);C.t=setTimeout(()=>$('toast').classList.add('hidden'),2800)}
function save(){try{localStorage.setItem('niyb-save',JSON.stringify(state))}catch(e){}}
function load(){try{const x=localStorage.getItem('niyb-save');return x?JSON.parse(x):null}catch(e){return null}}
function newGame(mode){state=defaultState();state.mode=mode;if(mode==='creative'){state.money=999999;state.science=9999;state.rep=999;for(const k in state.parts)state.parts[k]=true;for(const k in state.tech)state.tech[k]=true;state.rocket={fuel:100,engines:8,tanks:8,stages:5,computer:5,fins:8,payload:8,shield:5}}$('start').classList.add('hidden');$('game').classList.remove('hidden');tab='backyard';render();save()}
function resetGame(){if(confirm('Start a new game? Your current save will be replaced.')){localStorage.removeItem('niyb-save');$('game').classList.add('hidden');$('start').classList.remove('hidden')}}
function showHow(){alert('STORY: earn money, buy equipment, research technology, engineer rockets, complete contracts and reach orbit. After orbit, unlock the Solar System and establish missions to every major planet.\\n\\nCREATIVE: unlimited money, equipment and research. Build anything.\\n\\nRocket failures are simulated from your design: mass, thrust, stability, fuel, staging, heat and guidance all affect the outcome.\\n\\nThere is also a genuinely hidden cheese storage. Good luck finding it.')}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()}));
function spend(n){if(state.mode==='creative')return true;if(state.money>=n){state.money-=n;return true}toast('Not enough money.');return false}
function reward(m,s=0,r=0){state.money+=m;state.science+=s;state.rep+=r;toast(`+${m} credits${s?` · +${s} science`:''}${r?` · +${r} rep`:''}`);save()}
function techCost(k){return {basic:0,liquid:40,staging:65,guidance:90,orbital:120,reusable:180,deep:260,nuclear:320,lunar:420,interplanetary:600}[k]||9999}
const techInfo={basic:['Basic Engineering','Workbench, small engines and your first experiments.'],liquid:['Liquid Propulsion','Higher-efficiency engines and larger tanks.'],staging:['Staging','Separate rocket stages for much higher performance.'],guidance:['Guidance Computer','Better steering and much more stable launches.'],orbital:['Orbital Engineering','The technology required for stable orbit attempts.'],reusable:['Reusable Systems','Recover and reuse valuable hardware.'],deep:['Deep Space','Interplanetary navigation and high-power systems.'],nuclear:['Nuclear Propulsion','Extreme deep-space propulsion.'],lunar:['Lunar Engineering','Build spacecraft capable of sustained lunar operations.'],interplanetary:['Interplanetary Program','Unlock missions across the Solar System.']};
function techReq(k){return {liquid:'basic',staging:'liquid',guidance:'liquid',orbital:'staging',reusable:'orbital',deep:'orbital',nuclear:'deep',lunar:'deep',interplanetary:'lunar'}[k]}
function research(k){if(state.tech[k])return;let req=techReq(k);if(req&&!state.tech[req])return toast('Research the prerequisite first.');let c=techCost(k);if(state.science<c)return toast(`Need ${c} science points.`);state.science-=c;state.tech[k]=true;toast(`Research complete: ${techInfo[k][0]}`);save();render()}
function buyPart(k,c){if(state.parts[k])return;if(spend(c)){state.parts[k]=true;toast('Equipment purchased.');save();render()}}
function partName(k){return {workshop:'Engineering workshop',teststand:'Engine test stand',computer:'Mission computer',fuelgear:'Fuel handling equipment',pad:'Launch pad',tracking:'Tracking station',advancedLab:'Advanced research lab'}[k]}
function render(){if(!state)return; $('modeLabel').textContent=`· ${state.mode.toUpperCase()}`;$('money').textContent=Math.floor(state.money).toLocaleString();$('science').textContent=Math.floor(state.science).toLocaleString();$('rep').textContent=Math.floor(state.rep).toLocaleString();$('orbit').textContent=state.orbit;({backyard:renderBackyard,house:renderHouse,rocket:renderRocket,research:renderResearch,missions:renderMissions,solar:renderSolar}[tab])();save()}
function renderBackyard(){let progress=Math.min(100,(state.rep/120)*100);$('content').innerHTML=`<div class="grid"><div><div class="yard"><div class="pad"></div><div class="building garage"></div><div class="building radar"></div><div id="yardRocket" class="rocket">🚀</div></div><div class="card"><h2>Your Backyard Space Center</h2><p class="muted">Build the infrastructure, then turn the grass into a launch complex.</p><div class="row">${Object.entries(state.parts).filter(([k,v])=>v).map(([k])=>`<span class="pill">✓ ${partName(k)}</span>`).join('')||'<span class="muted">You have almost nothing. Yet.</span>'}</div><hr style="border-color:#243148"><div class="small muted">Space program reputation</div><div class="bar"><span style="width:${progress}%"></span></div></div></div><div class="list"><div class="card"><h3>Contracts</h3><div class="item mission"><div><b>Backyard Test Flight</b><p>Complete any powered launch.</p></div><button class="btn tiny" onclick="contract('launch')">ACCEPT</button></div><div class="item mission"><div><b>Altitude Record</b><p>Reach 10 km.</p></div><button class="btn tiny" onclick="contract('height')">ACCEPT</button></div><div class="item mission"><div><b>Science Payload</b><p>Fly a scientific payload.</p></div><button class="btn tiny" onclick="contract('science')">ACCEPT</button></div><div class="item mission"><div><b>Orbit Demonstration</b><p>Reach stable orbit.</p></div><button class="btn tiny" onclick="contract('orbit')">ACCEPT</button></div></div><div class="card"><h3>Run Status</h3><p>${state.won?'🏆 Orbit achieved. The Solar System is now open.':'Story goal: build a vehicle capable of stable orbit.'}</p><p class="muted">A rocket can fail without ending the run. Bankruptcy is the real danger.</p><button class="btn" onclick="findSecret()">Inspect suspicious backyard objects</button></div></div></div>`}
function contract(k){if(state.missions[k])return toast('That contract is already completed.');toast('Contract accepted. Build and fly a suitable mission.')}
function renderHouse(){ $('content').innerHTML=`<div class="card"><h2>🏠 Your Two-Story House</h2><p class="muted">Walk through the house. Upgrade equipment. Some things are deliberately not explained.</p><div class="house"><div class="houseTop"><div class="room"><b>🖥️ Computer Lab</b><span>Mission planning, telemetry and contracts.</span></div><div class="room"><b>🔬 Research Room</b><span>Blueprints and technology development.</span></div><div class="room"><b>📐 Engineering Office</b><span>Rocket design and analysis.</span></div></div><div class="houseBottom"><div class="room ground"><b>🛋️ Living Room</b><span>Mission patches and launch broadcasts.</span></div><div class="room ground"><b>🔧 Garage Workshop</b><span>${state.parts.workshop?'Engineering equipment installed.':'An empty garage. Buy a workshop to unlock serious construction.'}</span></div><div class="room ground"><b>🍳 Kitchen</b><span>Normal kitchen. Probably.</span></div><div class="room ground"><b>🚪 Backyard Door</b><span>Go build something questionable.</span></div><div class="room ground"><b>📦 Storage</b><span>Boxes, old parts and things you forgot about.</span></div><div class="room ground"><b>⬆️ Upstairs</b><span>Two floors of increasingly suspicious engineering.</span></div></div></div><div class="row" style="margin-top:12px"><button class="btn" onclick="inspectHouse()">Inspect house</button><button class="btn" onclick="buyPart('workshop',100)">Buy workshop · $100</button></div></div>`}
function inspectHouse(){state.time++;if(state.time>=7&&!state.cheese){state.cheese=true;state.house.secret=true;toast('You found a strange seam behind the storage shelves... CHEESE STORAGE DISCOVERED 🧀');render();}else toast(state.cheese?'The secret cheese storage is still there.':'You inspect every room. Nothing obvious.');save()}
function findSecret(){state.time++;if(state.time>=10&&!state.cheese){state.cheese=true;state.house.secret=true;toast('A hidden hatch opens. 🧀 SECRET CHEESE STORAGE FOUND!');render();}else toast(state.cheese?'The cheese bunker is already yours.':'You find nothing. Maybe look around the house...');save()}
function renderRocket(){let q=state.rocket, mass=Math.round(q.tanks*18+q.engines*12+q.fuel*.65+q.stages*16+q.computer*4+q.fins*2+q.payload*8+q.shield*5), thrust=q.engines*(state.tech.liquid?55:32), stability=Math.min(100,35+q.fins*7+q.computer*9-q.engines*3), fuelTime=Math.round(q.fuel*2.2/(q.engines||1)), score=Math.round(thrust*stability/(mass||1));$('content').innerHTML=`<div class="grid"><div class="card"><h2>🧑‍🔧 Rocket Engineering Lab</h2><p class="muted">Adjust the design. Every value affects the flight.</p><div class="blueprint"><div style="text-align:center;color:#7890aa">LIVE BLUEPRINT</div><div class="stage">PAYLOAD<br>${q.payload?`📦 ${q.payload} unit(s)`:'—'}</div>${Array.from({length:q.stages},(_,i)=>`<div class="stage">STAGE ${q.stages-i}<br>🛢️ ${Math.max(1,Math.ceil(q.tanks/q.stages))} tank · 🔥 ${Math.max(1,Math.ceil(q.engines/q.stages))} engine<br>${q.fins} fins total</div>`).join('')}<div style="text-align:center">⇩ THRUST ⇩</div></div></div><div class="card"><h3>Design controls</h3><div class="parts">${control('Fuel',q.fuel,'fuel',10,10,100)}${control('Engines',q.engines,'engines',1,1,12)}${control('Tanks',q.tanks,'tanks',1,1,12)}${control('Stages',q.stages,'stages',1,1,6)}${control('Guidance',q.computer,'computer',1,0,5)}${control('Fins',q.fins,'fins',1,0,12)}${control('Payload',q.payload,'payload',1,0,10)}${control('Heat shield',q.shield,'shield',1,0,5)}</div><hr style="border-color:#243148"><h3>Flight analysis</h3><p>Mass: <b>${mass}</b> · Thrust: <b>${thrust}</b></p><p>Stability: <b>${stability}%</b> · Estimated burn: <b>${fuelTime}s</b></p><p>Engineering score: <b>${score}</b></p><button class="btn primary" onclick="launchRocket()">🚀 LAUNCH ROCKET</button></div></div>`}
function control(label,val,key,step,min,max){return `<div class="part"><b>${label}: ${val}</b><input type="range" min="${min}" max="${max}" step="${step}" value="${val}" oninput="setRocket('${key}',this.value)"></div>`}
function setRocket(k,v){state.rocket[k]=Number(v);renderRocket();save()}
function launchRocket(){let q=state.rocket;if(!state.parts.pad&&state.mode!=='creative')return toast('You need a launch pad.');if(!state.parts.workshop&&state.mode!=='creative')return toast('You need a workshop.');if(!state.parts.teststand&&state.mode!=='creative')return toast('Test the rocket with an engine test stand first.');let mass=q.tanks*18+q.engines*12+q.fuel*.65+q.stages*16+q.computer*4+q.fins*2+q.payload*8+q.shield*5;let thrust=q.engines*(state.tech.liquid?55:32), stability=Math.min(100,35+q.fins*7+q.computer*9-q.engines*3), guidance=q.computer*10+(state.tech.guidance?25:0), staging=state.tech.staging?q.stages*12:q.stages*4;let power=thrust*1.8+guidance+staging-mass*1.25;let height=Math.max(0,Math.round(power*(0.8+Math.random()*.55)));let stable=height>180&&stability>58&&q.stages>=2&&state.tech.orbital&&state.parts.tracking;let fail=power<20||stability<35||Math.random()<(stability<50?.45:.12);let el=document.querySelector('#yardRocket');if(!el){tab='backyard';render();el=document.querySelector('#yardRocket')}if(fail){el.classList.add('explode');toast('💥 ROCKET FAILURE — structural or propulsion failure. Check your design.');state.money=Math.max(0,state.money-50);setTimeout(()=>{el.classList.remove('explode')},700);save();return}el.classList.add('launch');state.missions.launch=true;if(height>=10000)state.missions.height=true;if(q.payload>0)state.missions.science=true;if(stable){state.missions.orbit=true;state.orbit++;state.won=true;reward(800,120,30);toast('🛰️ STABLE ORBIT ACHIEVED! Solar System unlocked!')}else{let gain=100+Math.min(400,Math.round(height/20));reward(gain,Math.max(5,Math.round(height/300)),10);toast(`🚀 Launch successful! Apogee: ${height.toLocaleString()} m`)}setTimeout(()=>el.classList.remove('launch'),2200);render();save()}
function renderResearch(){let html=Object.entries(techInfo).map(([k,v])=>`<div class="tech ${state.tech[k]?'done':''}"><b>${v[0]}</b><p class="small muted">${v[1]}</p><div class="small">${state.tech[k]?'✓ RESEARCHED':`Cost: ${techCost(k)} SP`}</div>${!state.tech[k]?`<button class="btn tiny" onclick="research('${k}')">RESEARCH</button>`:''}</div>`).join('');$('content').innerHTML=`<div class="card"><h2>🔬 Research Tree</h2><p class="muted">Technology is earned through experiments, contracts and successful missions.</p><div class="research">${html}</div></div>`}
function renderMissions(){let missions=[['launch','First Launch','Launch a powered rocket.','🚀'],['height','High Flyer','Reach 10 km altitude.','☁️'],['science','Scientist','Launch a payload.','🔬'],['orbit','Orbital','Achieve stable orbit.','🛰️']];$('content').innerHTML=`<div class="card"><h2>📋 Mission Control</h2><p class="muted">Your campaign milestones.</p>${missions.map(x=>`<div class="item mission"><div><b>${x[3]} ${x[1]}</b><p>${x[2]}</p></div><strong class="${state.missions[x[0]]?'ok':'muted'}">${state.missions[x[0]]?'COMPLETED':'INCOMPLETE'}</strong></div>`).join('')}<div class="item" style="margin-top:10px"><b>Current objective</b><p>${state.orbit<1?'Build the technology and infrastructure needed for stable orbit.':'Orbit achieved. Go to Solar System to begin planetary missions.'}</p></div></div>`}
const planets=[['moon','🌙','Moon',250,'lunar'],['mars','🔴','Mars',400,'interplanetary'],['jupiter','🟠','Jupiter',650,'deep'],['saturn','🪐','Saturn',800,'deep'],['uranus','🔵','Uranus',950,'deep'],['neptune','🔵','Neptune',1100,'deep']];
function renderSolar(){let open=state.orbit>0; $('content').innerHTML=`<div class="card"><h2>🌌 Solar System Program</h2><p class="muted">${open?'Orbit achieved. Establish a permanent presence throughout the Solar System.':'Achieve stable Earth orbit first.'}</p><div class="world">${planets.map(p=>`<div class="planet ${state.missions[p[0]]?'done':''}"><div class="orb">${p[1]}</div><h3>${p[2]}</h3><p class="small muted">Mission funding: $${p[3]}</p><button class="btn tiny" ${!open||state.missions[p[0]]?'disabled':''} onclick="planetMission('${p[0]}',${p[3]},'${p[4]}')">${state.missions[p[0]]?'ESTABLISHED':'LAUNCH MISSION'}</button></div>`).join('')}</div><div class="item" style="margin-top:12px"><b>Solar System completion</b><p>${planets.filter(p=>state.missions[p[0]]).length}/${planets.length} destinations established.</p></div></div>`}
function planetMission(k,c,req){if(state.missions[k])return;if(state.orbit<1)return toast('You need Earth orbit first.');if(!state.tech[req]&&state.mode!=='creative')return toast('Research the required technology first.');if(!spend(c))return;let chance=Math.min(.95,.55+state.rep/500+state.orbit*.05);if(Math.random()<chance||state.mode==='creative'){state.missions[k]=true;state.rep+=40;state.science+=80;toast(`🌌 ${k.toUpperCase()} mission established!`)}else{toast('Mission failed. The spacecraft was lost. Funding is gone, but the program survives.')}save();renderSolar()}
const oldLoad=load();if(oldLoad){state=oldLoad;$('start').classList.add('hidden');$('game').classList.remove('hidden');render()}
</script>
